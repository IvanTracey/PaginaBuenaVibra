<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Productos de tienda online de productos holísticos y bienestar natural.">
        <meta name="keywords" content="holístico, bienestar, relajación, aromas, velas, difusores, sahumerios, armonía">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Logo en la pestaña -->
        <link rel="icon" href="img/logo_colibri.webp" type="img/logo.png">
        <!-- Uso de una fuente externa -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
        <!-- Inclusion del archivo CSS (luego de la fuente y del bootstrap) -->
        <link rel="stylesheet" href="css/estilos.css">

        <!-- Inclusion del archivo js -->
        <script src="js/main.js" defer></script>

        <!-- Titulo de la pestaña -->
        <title>Buena vibra</title>
    </head>

    <body>
        <!-- Header: Titulo y lista de navegacion -->
        <header class="header">
            <!-- Lado izquierdo: logo+titulo -->
            <div class="header-titulo">
                <img src="/img/logo_colibri.webp" alt="Imagen de un colibri en colores vivos. Logo del emprendimiento" class="logo-colibri">
                <a class="titulo"><strong>Buena vibra</strong></a>
            </div>
            <!-- Lado derecho: Navbar desplegable-->
            <div class="header-pages">
                <button class="boton-registro">REGISTRO</button>
                <button class="boton-productos">PRODUCTOS</button>
            </div>
        </header>
        <main class="main-productos">
        </main> 

        <footer>
           <div>
                <p>© 2026 Buena vibra. Todos los derechos reservados.</p>
                <p>Política de privacidad</p>
                <p>Términos y condiciones</p>
            </div>
            <nav>
                <ul>  
                    <!-- Uso el atributo ref por sugerencia de seguridad. No coincide los nombres con el de las redes porque estoy en una transicion. No tengo facebook aun. -->
                    <li><a href="https://www.instagram.com/diezpuntos.lp/" target="_blank" rel="noopener noreferrer"> <img src="/img/logo_ig.png" alt="Icono que te lleva al perfil de Instagram" class="social-icon"></a>  </li>
                    <li><a href="https://www.facebook.com/diezpuntos.lp/" target="_blank" rel="noopener noreferrer"> <img src="/img/logo_fb.png" alt="Icono que te lleva al perfil de Facebook" class="social-icon"></a>  </li>
                    <li><a href="https://wa.me/5492355411161" target="_blank" rel="noopener noreferrer"> <img src="/img/logo_wa.png" alt="Icono que te lleva al Whats app" class="social-icon"></a></li>   
                </ul>
            </nav>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    </body>
</html>
